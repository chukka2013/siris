<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu Melodies - Your Music Companion</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-music"></i> Telugu Melodies
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#trending">Trending</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#playlists">Playlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#artists">Artists</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1>Discover the Magic of Telugu Music</h1>
                    <p>Listen to the best Telugu songs from classic to contemporary</p>
                    <button class="btn btn-primary btn-lg">Start Listening</button>
                </div>
                <div class="col-md-6">
                    <div class="hero-image">
                        <img src="https://source.unsplash.com/random/600x400/?music" alt="Music" class="img-fluid rounded">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Trending Section -->
    <section id="trending" class="trending py-5">
        <div class="container">
            <h2 class="section-title">Top Telugu Songs</h2>
            <div class="gaana-embed">
                <iframe 
                    src="https://gaana.com/playlist/gaana-dj-telugu-top-50-1" 
                    width="100%" 
                    height="600" 
                    frameborder="0" 
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>

    <!-- Music Player -->
    <div class="music-player">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <div class="now-playing">
                        <img src="https://source.unsplash.com/random/50x50/?album" alt="Album" class="img-fluid">
                        <div class="song-details">
                            <h6>Current Song</h6>
                            <p>Artist Name</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="player-controls">
                        <button class="btn btn-link"><i class="fas fa-random"></i></button>
                        <button class="btn btn-link"><i class="fas fa-step-backward"></i></button>
                        <button class="btn btn-link play-btn"><i class="fas fa-play"></i></button>
                        <button class="btn btn-link"><i class="fas fa-step-forward"></i></button>
                        <button class="btn btn-link"><i class="fas fa-redo"></i></button>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
