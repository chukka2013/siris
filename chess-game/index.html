<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>Chess Game</h1>
            <div class="game-info">
                <div class="player-turn">
                    Current Turn: <span id="current-player">White</span>
                </div>
                <div class="captured-pieces">
                    <div class="white-captured">
                        <h4>White Captured</h4>
                        <div id="white-captured-pieces"></div>
                    </div>
                    <div class="black-captured">
                        <h4>Black Captured</h4>
                        <div id="black-captured-pieces"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="game-board">
            <div id="chessboard"></div>
        </div>

        <div class="game-controls">
            <button id="reset-game" class="btn btn-primary">
                <i class="fas fa-redo"></i> Reset Game
            </button>
            <button id="undo-move" class="btn btn-secondary">
                <i class="fas fa-undo"></i> Undo Move
            </button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
