<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Chase Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Racing Chase</h1>
            <div class="game-stats">
                <span>Score: <span id="score">0</span></span>
                <span>Speed: <span id="speed">0</span> km/h</span>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="game-controls">
            <div class="mobile-controls">
                <button id="leftBtn" class="control-btn">←</button>
                <button id="rightBtn" class="control-btn">→</button>
                <button id="accelerateBtn" class="control-btn">↑</button>
                <button id="brakeBtn" class="control-btn">↓</button>
            </div>
            <button id="startBtn" class="btn btn-primary">Start Game</button>
        </div>

        <div class="instructions">
            <h3>How to Play</h3>
            <p>Use arrow keys or on-screen controls to chase and catch other vehicles.</p>
            <p>Press SPACE to use nitro boost!</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
